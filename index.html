<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Completa - Tudo o Que Você Precisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#165DFF', secondary: '#36CFC9', dark: '#1D2129' } } }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-dark">
    <header class="sticky top-0 z-50 bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary">Loja Completa</h1>
            <div class="flex items-center gap-4">
                <div class="relative w-60 hidden md:block">
                    <input type="text" id="buscaProduto" placeholder="Buscar produtos..." class="w-full px-3 py-1.5 rounded-lg border border-gray-200">
                    <i class="fa-solid fa-search absolute right-2.5 top-2 text-gray-400"></i>
                </div>
                <button class="relative" onclick="abrirCarrinho()">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="contadorCarrinho" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
        <nav class="bg-gray-100 px-4 py-2 overflow-x-auto">
            <div class="container mx-auto flex gap-6 whitespace-nowrap">
                <a href="#" class="categoria-ativo text-primary font-medium" data-categoria="todos">Todos</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="eletronicos">Eletrônicos</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="roupas">Roupas e Moda</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="joias">Joias e Pratas</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="calcados">Calçados</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="casa">Casa e Decoração</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="beleza">Beleza e Saúde</a>
                <a href="#" class="text-gray-600 hover:text-primary" data-categoria="esportes">Esportes</a>
            </div>
        </nav>
    </header>

    <section class="py-12">
        <div class="container mx-auto px-4">
            <h3 class="text-2xl font-bold mb-8">Nossos Produtos</h3>
            <div id="listaProdutos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <div id="carrinho" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white shadow-2xl transform translate-x-full transition-transform z-[60]">
        <div class="h-full flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg">Seu Carrinho</h3>
                <button onclick="fecharCarrinho()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="itensCarrinho" class="flex-1 overflow-y-auto p-4"><p class="text-center text-gray-500 mt-10">Seu carrinho está vazio</p></div>
            <div class="p-4 border-t">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="valorTotal">R$ 0,00</span>
                </div>
                <button class="w-full bg-primary text-white py-3 rounded-lg hover:bg-primary/90 transition">Finalizar Compra</button>
            </div>
        </div>
    </div>
    <div id="fundoCarrinho" class="fixed inset-0 bg-black/50 hidden z-50" onclick="fecharCarrinho()"></div>

    <footer class="bg-dark text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>© 2026 Loja Completa - Todos os direitos reservados</p>
        </div>
    </footer>

    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
